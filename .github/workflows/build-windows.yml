name: Build Windows App

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.11'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Prepare bundled FFmpeg
        run: python scripts/prepare_ffmpeg.py

      - name: Build standalone EXE
        shell: cmd
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name YouTubeVODClipper
          --collect-all customtkinter
          --collect-all tkwry
          --hidden-import imageio_ffmpeg
          --add-binary "%CD%\tools\ffmpeg\ffmpeg.exe;."
          src\youtube_vod_clipper\app.py

      - name: Verify output
        run: if (!(Test-Path 'dist/YouTubeVODClipper.exe')) { throw 'EXE was not produced' }
        shell: pwsh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeVODClipper-Windows-x64
          path: dist/YouTubeVODClipper.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/YouTubeVODClipper.exe
